
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">

<title>Hypersonic Alliance | Vanguard Aviation Systems</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
}

/* PORTADA COMPLETA */

.portada {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background-color: #050505;
  background-image: url("portada-es74.png");
  background-position: center;
  background-repeat: no-repeat;
  background-size: contain;
}

/* BOTÓN DE MÚSICA */

.musica {
  position: fixed;
  z-index: 20;
  top: max(12px, env(safe-area-inset-top));
  right: 12px;
}

.boton-musica {
  min-height: 44px;
  padding: 11px 15px;
  border: 2px solid #d6ad55;
  border-radius: 8px;
  background: rgba(0,0,0,0.9);
  color: white;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
  cursor: pointer;
}

/* ACCESOS */

.navegacion {
  position: fixed;
  z-index: 20;
  bottom: max(14px, env(safe-area-inset-bottom));
  left: 12px;
  right: 12px;

  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.navegacion a {
  min-width: 0;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;

  padding: 10px 5px;
  border: 2px solid #d6ad55;
  border-radius: 8px;

  background: rgba(0,0,0,0.92);
  color: #ffffff;

  text-align: center;
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
}

.navegacion a:active,
.boton-musica:active {
  background: #d6ad55;
  color: #000000;
}

/* IPHONE Y PANTALLAS PEQUEÑAS */

@media (max-width: 380px) {
  .navegacion {
    left: 8px;
    right: 8px;
    gap: 7px;
  }

  .navegacion a {
    font-size: 10px;
    letter-spacing: 0;
  }

  .boton-musica {
    font-size: 10px;
    padding: 10px;
  }
}
</style>
</head>

<body>

<!-- IMAGEN PRINCIPAL -->
<main class="portada" aria-label="Portada ES74"></main>

<!-- REPRODUCTOR -->
<div class="musica">
  <button
    id="botonMusica"
    class="boton-musica"
    type="button">
    ▶ ACTIVAR MÚSICA
  </button>
</div>

<audio
  id="audioPortada"
  src="portada.mp3"
  preload="auto"
  loop
  playsinline>
</audio>

<!-- ACCESOS PRINCIPALES -->
<nav class="navegacion">

  <a href="investigacion.html">
    INVESTIGACIÓN →
  </a>

  <a href="catalogo.html">
    CATÁLOGO →
  </a>

</nav>

<script>
const audio = document.getElementById("audioPortada");
const boton = document.getElementById("botonMusica");

function actualizarBoton() {
  boton.textContent = audio.paused
    ? "▶ ACTIVAR MÚSICA"
    : "⏸ PAUSAR MÚSICA";
}

boton.addEventListener("click", async () => {
  if (audio.paused) {
    try {
      await audio.play();
    } catch (error) {
      actualizarBoton();
    }
  } else {
    audio.pause();
  }

  actualizarBoton();
});

audio.addEventListener("play", actualizarBoton);
audio.addEventListener("pause", actualizarBoton);
audio.addEventListener("ended", actualizarBoton);
</script>

</body>
</html>
