<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HYPERSONIC ALLIANCE</title>

<!-- PRE CARGA DE LA PORTADA -->
<link rel="preload" as="image" href="portada-es74.png">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

.portada {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 100vh;

    background-color: #000;
    background-image: url("portada-es74.png");
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
}

/* BOTONES */

.boton {
    position: absolute;
    bottom: max(25px, env(safe-area-inset-bottom));

    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-width: 155px;
    padding: 15px 22px;

    color: #ffe8a6;
    background: rgba(0,0,0,0.85);

    border: 1px solid #d9b66d;
    border-radius: 5px;

    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    text-decoration: none;
    text-align: center;
}

.investigacion {
    left: max(20px, env(safe-area-inset-left));
}

.catalogo {
    right: max(20px, env(safe-area-inset-right));
}

/* MÚSICA */

.musica {
    position: absolute;
    top: max(20px, env(safe-area-inset-top));
    right: 20px;

    padding: 11px 16px;

    color: #ffe8a6;
    background: rgba(0,0,0,0.85);

    border: 1px solid #d9b66d;
    border-radius: 5px;

    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

@media (max-width: 480px) {
    .boton {
        min-width: 135px;
        padding: 13px 12px;
        font-size: 11px;
        letter-spacing: 1px;
        bottom: max(20px, env(safe-area-inset-bottom));
    }

    .investigacion {
        left: 12px;
    }

    .catalogo {
        right: 12px;
    }

    .musica {
        right: 12px;
        top: max(12px, env(safe-area-inset-top));
    }
}
</style>
</head>

<body>

<main class="portada">

    <button class="musica" id="controlMusica">
        ▶ ACTIVAR MÚSICA
    </button>

    <audio
        id="audioPortada"
        src="portada.mp3"
        preload="auto"
        loop
        playsinline>
    </audio>

    <a class="boton investigacion" href="investigacion.html">
        INVESTIGACIÓN →
    </a>

    <a class="boton catalogo" href="catalogo.html">
        CATÁLOGO →
    </a>

</main>

<script>
const audio = document.getElementById("audioPortada");
const boton = document.getElementById("controlMusica");

/* INTENTO DE REPRODUCCIÓN AUTOMÁTICA */

async function iniciarMusica() {
    try {
        await audio.play();
        boton.textContent = "⏸ PAUSAR MÚSICA";
    } catch (error) {
        boton.textContent = "▶ ACTIVAR MÚSICA";
    }
}

/* ACTIVACIÓN MANUAL SI EL NAVEGADOR LA BLOQUEA */

boton.addEventListener("click", async () => {
    if (audio.paused) {
        try {
            await audio.play();
            boton.textContent = "⏸ PAUSAR MÚSICA";
        } catch (error) {
            boton.textContent = "⚠ REINTENTAR";
        }
    } else {
        audio.pause();
        boton.textContent = "▶ ACTIVAR MÚSICA";
    }
});

/* ESTADO DEL BOTÓN */

audio.addEventListener("play", () => {
    boton.textContent = "⏸ PAUSAR MÚSICA";
});

audio.addEventListener("pause", () => {
    boton.textContent = "▶ ACTIVAR MÚSICA";
});

/* INICIAR AL CARGAR */

window.addEventListener("load", iniciarMusica);
</script>

</body>
</html>
