<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">

<title>HYPERSONIC ALLIANCE · ES74</title>

<link rel="preload" as="image" href="portada-es74.png">

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #050505;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
}

.portada {
    position: fixed;
    inset: 0;
    background-image: url("portada-es74.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}

.musica {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    right: 18px;
    z-index: 10;
}

.boton-musica,
.navegacion a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.82);
    color: #fff;
    border: 2px solid #d6ad55;
    border-radius: 8px;
    padding: 13px 17px;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    min-height: 46px;
}

.boton-musica:active,
.navegacion a:active {
    background: #d6ad55;
    color: #000;
}

.navegacion {
    position: fixed;
    bottom: max(22px, env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 18px;
    gap: 12px;
}

.navegacion a {
    text-align: center;
    min-width: 145px;
}

@media (max-width: 380px) {
    .navegacion a {
        min-width: 0;
        flex: 1;
        padding: 12px 8px;
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="portada"></div>

<div class="musica">
    <button id="botonMusica" class="boton-musica" type="button">
        ▶ ACTIVAR MÚSICA
    </button>
</div>

<audio
    id="audioPortada"
    src="portada.mp3"
    preload="auto"
    loop
    playsinline
    webkit-playsinline>
</audio>

<nav class="navegacion">
    <a href="investigacion.html">INVESTIGACIÓN →</a>
    <a href="catalogo.html">CATÁLOGO →</a>
</nav>

<script>
const audio = document.getElementById("audioPortada");
const boton = document.getElementById("botonMusica");

let musicaActiva = false;

function actualizarBoton() {
    if (!audio.paused) {
        boton.textContent = "⏸ PAUSAR MÚSICA";
        musicaActiva = true;
    } else {
        boton.textContent = "▶ ACTIVAR MÚSICA";
        musicaActiva = false;
    }
}

async function activarMusica() {
    try {
        audio.volume = 1;
        await audio.play();
        actualizarBoton();
    } catch (error) {
        actualizarBoton();
    }
}

boton.addEventListener("click", async function() {
    if (audio.paused) {
        await activarMusica();
    } else {
        audio.pause();
        actualizarBoton();
    }
});

/* Intento de reproducción automática */
window.addEventListener("load", function() {
    activarMusica();
});

/* Reintento tras la primera interacción del visitante */
["touchstart", "click", "keydown"].forEach(function(evento) {
    document.addEventListener(evento, function() {
        if (audio.paused && !musicaActiva) {
            activarMusica();
        }
    }, { once: true, passive: true });
});

audio.addEventListener("play", actualizarBoton);
audio.addEventListener("pause", actualizarBoton);
audio.addEventListener("ended", actualizarBoton);
</script>

</body>
</html>
