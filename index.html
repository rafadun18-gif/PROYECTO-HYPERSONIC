<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HYPERSONIC ALLIANCE</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

.portada {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 100vh;
    background-image: url("portada-es74.png");
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
}

/* BOTONES PRINCIPALES */

.boton {
    position: absolute;
    bottom: max(25px, env(safe-area-inset-bottom));
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 155px;
    padding: 15px 22px;
    color: #ffe8a6;
    background: rgba(0, 0, 0, 0.82);
    border: 1px solid #d9b66d;
    border-radius: 5px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    text-decoration: none;
    text-align: center;
    box-shadow: 0 0 15px rgba(217,182,109,0.25);
    transition: 0.3s;
}

.boton:hover {
    background: #d9b66d;
    color: #000;
    box-shadow: 0 0 22px rgba(217,182,109,0.7);
}

.investigacion {
    left: max(20px, env(safe-area-inset-left));
}

.catalogo {
    right: max(20px, env(safe-area-inset-right));
}

/* CONTROL DE MÚSICA */

.musica {
    position: absolute;
    top: max(20px, env(safe-area-inset-top));
    right: 20px;
    padding: 11px 16px;
    color: #ffe8a6;
    background: rgba(0,0,0,0.8);
    border: 1px solid #d9b66d;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
}

.musica:active {
    background: #d9b66d;
    color: #000;
}

/* MÓVILES */

@media (max-width: 480px) {
    .boton {
        min-width: 135px;
        padding: 13px 12px;
        font-size: 11px;
        letter-spacing: 1px;
        bottom: max(20px, env(safe-area-inset-bottom));
    }

    .investigacion {
        left: 12px;
    }

    .catalogo {
        right: 12px;
    }

    .musica {
        right: 12px;
        top: max(12px, env(safe-area-inset-top));
    }
}
</style>
</head>

<body>

<main class="portada">

    <button class="musica" id="controlMusica" type="button">
        ▶ ACTIVAR MÚSICA
    </button>

    <audio id="audioPortada" src="portada.mp3" loop preload="auto"></audio>

    <a class="boton investigacion" href="investigacion.html">
        INVESTIGACIÓN →
    </a>

    <a class="boton catalogo" href="catalogo.html">
        CATÁLOGO →
    </a>

</main>

<script>
const audio = document.getElementById("audioPortada");
const botonMusica = document.getElementById("controlMusica");

let reproduciendo = false;

botonMusica.addEventListener("click", async function() {

    if (!reproduciendo) {
        try {
            await audio.play();
            reproduciendo = true;
            botonMusica.textContent = "⏸ PAUSAR MÚSICA";
        } catch (error) {
            botonMusica.textContent = "⚠ VOLVER A INTENTAR";
        }
    } else {
        audio.pause();
        reproduciendo = false;
        botonMusica.textContent = "▶ ACTIVAR MÚSICA";
    }

});

audio.addEventListener("ended", function() {
    reproduciendo = false;
    botonMusica.textContent = "▶ ACTIVAR MÚSICA";
});
</script>

</body>
</html>
